<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Grandiose Supermarket · Bakery Division financial command center" />
    <!-- Space Grotesk / IBM Plex Mono are self-hosted via src/styles/fonts.css, no external font request -->
    <title>Bakery Command Center · Grandiose Supermarket</title>
    <script>
      // Applied before paint so the theme toggle never flashes the wrong palette.
      (function () {
        try {
          var stored = localStorage.getItem('bcc-theme');
          var theme = stored === 'light' || stored === 'dark' ? stored : 'dark';
          if (theme === 'light') document.documentElement.classList.add('light');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
